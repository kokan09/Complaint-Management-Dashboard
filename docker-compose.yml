version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: complaint_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=complaint_dashboard

  backend:
    build: ./backend
    container_name: complaint_backend
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/complaint_dashboard
      - AI_SERVICE_URL=http://ai-engine:5000
      - PORT=3001
    depends_on:
      - mongodb
      - ai-engine

  ai-engine:
    build: ./ai-engine
    container_name: complaint_ai_engine
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: complaint_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
